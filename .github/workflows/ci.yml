name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0

      - name: Install tflint
        env:
          TFLINT_VERSION: 0.66.0
          TFLINT_SHA256: 22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e
        run: |
          curl -fsSLo tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint.zip" | sha256sum -c -
          sudo unzip -o -q tflint.zip -d /usr/local/bin
          rm tflint.zip

      - name: Format
        run: terraform fmt -recursive -check -diff

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform -chdir=examples/complete init -backend=false -input=false
          terraform -chdir=examples/complete validate

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl"

      # Plans against a mock AWS provider: no credentials, nothing
      # created.
      - name: Test
        run: terraform test
